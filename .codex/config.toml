# Project MCPs enabled at the owner's request. Start Codex at the repository root.
# Build the local code index with tools/build_graph.sh before Graphify queries.
# Existing sessions may need MCP reload/restart to discover these tools.
# Claude Opus 5.5 uses .mcp.json directly.

[mcp_servers.chrome-devtools]
command = "node"
args = ["tools/mcp_chrome_devtools.mjs"]
enabled = true
startup_timeout_sec = 60

[mcp_servers.graphify]
command = "uv"
args = ["run", "--offline", "--no-project", "--with", "graphifyy[mcp]==0.9.84", "python", "-m", "graphify.serve", "graphify-out/graph.json"]
env = { UV_CACHE_DIR = ".cache/uv" } # filled by tools/build_graph.sh (--offline)
enabled = true
startup_timeout_sec = 60

[mcp_servers.uomd-unity-live]
command = "node"
args = ["node_modules/tsx/dist/cli.mjs", "tools/mcp_unity_live.ts"]
enabled = true
startup_timeout_sec = 60

# MCP for Unity (CoplayDev/unity-mcp v10.3.0): drives the open Unity Editor. Pinned with the Unity package
# com.coplaydev.unity-mcp in apps/unity/Packages/manifest.json; set Window → MCP for Unity → Transport to stdio once.
[mcp_servers.unityMCP]
command = "uvx"
args = ["--from", "mcpforunityserver==10.3.0", "mcp-for-unity", "--transport", "stdio"]
env = { UV_CACHE_DIR = ".cache/uv" } # repo-local uv cache: on Windows, installing pywin32 into the AppData cache can fail with os error 32
enabled = true
startup_timeout_sec = 120
