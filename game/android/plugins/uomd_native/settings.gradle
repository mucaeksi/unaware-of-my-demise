// Standalone Gradle build of the UomdNative Android plugin (Godot Android plugin v2).
// Build with: game/tools/build_uomd_native.sh  (writes the AARs into game/addons/uomd_native/bin).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "uomd_native"
