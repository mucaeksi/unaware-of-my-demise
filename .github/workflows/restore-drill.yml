# Restore drill (INF-011, docs/runbooks/BACKUP_RESTORE.md): proves that production's data can be brought back into an
# empty PostgreSQL and is whole there. It dumps production read-only (pg_dump, one consistent snapshot over the direct,
# non-pooled Neon endpoint), restores the dump into a disposable PostgreSQL of the production major on the runner, then
# checks the migration ledger against this checkout and the economic journal against every balance (database/verify.sh).
# Timings and sizes go to the run summary as the recovery-time evidence.
#
# Nothing is written to production. The dump holds player data: it stays on the ephemeral runner, is never uploaded as an
# artifact and is deleted at the end. Uses the production environment's secret DATABASE_URL; skipped with a warning
# when it is not set.
name: Restore drill

on:
  workflow_dispatch:
  schedule:
    # Monthly, on the 1st at 04:41 UTC (after the 03:17 retention cron, outside Neon's Sunday 02:00-03:00 window).
    - cron: "41 4 1 * *"

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        # The production major (database/POSTGRES_MAJOR); checked below against production itself.
        image: postgres:18
        # Throwaway database on the runner, not a secret.
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESTORE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RESTORE_URL: postgresql://postgres:postgres@localhost:5432/restore_drill
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning::Restore drill skipped: secret DATABASE_URL is not set"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - name: Dump production (read-only)
        if: steps.config.outputs.ready == 'true'
        run: |
          # pg_dump needs a session: Neon's pooled host ("-pooler") runs PgBouncer in transaction mode, so use the direct one.
          direct="${DATABASE_URL/-pooler./.}"
          echo "::add-mask::${direct}"
          major="$(tr -d '[:space:]' < database/POSTGRES_MAJOR)"
          started=$(date +%s)
          # The client matches the production major; the URL goes in through the environment, not the command line.
          docker run --rm --network host -e DUMP_URL="${direct}" -v "${RUNNER_TEMP}:/work" "postgres:${major}" \
            sh -c 'pg_dump --dbname="${DUMP_URL}" --format=custom --no-owner --no-privileges --file=/work/production.dump'
          elapsed=$(( $(date +%s) - started ))
          size="$(du -h "${RUNNER_TEMP}/production.dump" | cut -f1)"
          echo "dump: ${size} in ${elapsed}s"
          {
            echo "## Restore drill"
            echo "| step | result |"
            echo "|---|---|"
            echo "| dump (pg_dump, custom format) | ${size} in ${elapsed}s |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Restore into a disposable PostgreSQL
        if: steps.config.outputs.ready == 'true'
        run: |
          major="$(tr -d '[:space:]' < database/POSTGRES_MAJOR)"
          psql "${RESTORE_ADMIN_URL}" -X -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE restore_drill"
          # Neon installs platform extensions (e.g. pg_session_jwt) that a stock PostgreSQL does not have and the game
          # schema does not use: leave out every extension the target cannot install, and say which.
          docker run --rm -v "${RUNNER_TEMP}:/work" "postgres:${major}" pg_restore --list /work/production.dump > "${RUNNER_TEMP}/toc.all"
          available="$(psql "${RESTORE_URL}" -X -At -c "SELECT name FROM pg_available_extensions")"
          skipped=""
          for extension in $(grep -oE ' EXTENSION - [A-Za-z0-9_]+' "${RUNNER_TEMP}/toc.all" | awk '{print $3}' | sort -u); do
            grep -qx "${extension}" <<<"${available}" || skipped="${skipped} ${extension}"
          done
          cp "${RUNNER_TEMP}/toc.all" "${RUNNER_TEMP}/toc.list"
          for extension in ${skipped}; do
            grep -vE " (COMMENT - )?EXTENSION ${extension}( |\$)| EXTENSION - ${extension}( |\$)" "${RUNNER_TEMP}/toc.list" > "${RUNNER_TEMP}/toc.next" || true
            mv "${RUNNER_TEMP}/toc.next" "${RUNNER_TEMP}/toc.list"
          done
          echo "extensions left out (not available here, not used by the game schema):${skipped:- none}"
          echo "| extensions left out | ${skipped:- none} |" >> "${GITHUB_STEP_SUMMARY}"
          started=$(date +%s)
          docker run --rm --network host -e RESTORE_URL -v "${RUNNER_TEMP}:/work" "postgres:${major}" \
            sh -c 'pg_restore --dbname="${RESTORE_URL}" --no-owner --no-privileges --exit-on-error --use-list=/work/toc.list /work/production.dump'
          elapsed=$(( $(date +%s) - started ))
          echo "restore: ${elapsed}s"
          echo "| restore (pg_restore into an empty database) | ${elapsed}s |" >> "${GITHUB_STEP_SUMMARY}"
      - name: The restored database matches production's ledger and is whole
        if: steps.config.outputs.ready == 'true'
        run: |
          direct="${DATABASE_URL/-pooler./.}"
          ledger() { psql "$1" -X -At -c "SELECT version || ' ' || filename || ' ' || sha256 FROM schema_migrations ORDER BY version"; }
          production_ledger="$(ledger "${direct}")"
          restored_ledger="$(ledger "${RESTORE_URL}")"
          [ "${production_ledger}" = "${restored_ledger}" ] || { echo "::error::the restored migration ledger differs from production's"; exit 1; }
          echo "ledger: $(printf '%s\n' "${restored_ledger}" | wc -l) migrations, identical to production"
          production_major="$(psql "${direct}" -X -At -c "SELECT current_setting('server_version_num')::int / 10000")"
          echo "production PostgreSQL major ${production_major}, restored into $(psql "${RESTORE_URL}" -X -At -c "SELECT current_setting('server_version_num')::int / 10000")"
          DATABASE_URL="${RESTORE_URL}" database/verify.sh | tee "${RUNNER_TEMP}/verify.log"
          {
            echo "| ledger | identical to production ($(printf '%s\n' "${restored_ledger}" | wc -l) migrations) |"
            echo "| integrity (database/verify.sh) | $(tail -n1 "${RUNNER_TEMP}/verify.log") |"
            grep -E '^[a-z_]+: [0-9]+$' "${RUNNER_TEMP}/verify.log" | sed -E 's/^([a-z_]+): ([0-9]+)$/| rows: \1 | \2 |/'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Delete the dump
        if: always()
        run: rm -f "${RUNNER_TEMP}/production.dump" "${RUNNER_TEMP}"/toc.*
