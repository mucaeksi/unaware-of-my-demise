name: Secrets check
# Manual only. Reports WHICH expected secrets / variables exist and whether they look valid. It never prints a secret value
# (variables are public identifiers and are shown). Use it to see what the owner has already configured.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      V_GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      V_ADMOB_AD_UNIT_IDS: ${{ vars.ADMOB_AD_UNIT_IDS }}
      V_PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
      V_RTDN_AUDIENCE: ${{ vars.RTDN_AUDIENCE }}
      V_RTDN_PUSH_SERVICE_ACCOUNT: ${{ vars.RTDN_PUSH_SERVICE_ACCOUNT }}
    steps:
      - name: Secrets (present? valid shape?)
        run: |
          set +x
          present() { if [ -n "${!1}" ]; then echo "SET      $1"; else echo "MISSING  $1"; fi; }
          for s in CLOUDFLARE_API_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT GCP_SERVICE_ACCOUNT_JSON ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD BACKUP_AGE_RECIPIENT; do present "$s"; done
          for s in GOOGLE_PLAY_SERVICE_ACCOUNT GCP_SERVICE_ACCOUNT_JSON; do
            if [ -n "${!s}" ]; then
              echo "${!s}" | jq -r '"  \(env.s // "json"): type=\(.type) project=\(.project_id) account=\(.client_email)"' 2>/dev/null || echo "  $s is NOT valid JSON"
            fi
          done
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/ks.jks 2>/dev/null && keytool -list -keystore /tmp/ks.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | grep -E "Keystore type|Your keystore contains|PrivateKeyEntry|trustedCertEntry" | sed 's/^/  keystore: /' || echo "  keystore: could not be opened with the given password"
            rm -f /tmp/ks.jks
          fi
      - name: Variables (public identifiers)
        run: |
          for v in GOOGLE_CLIENT_IDS ADMOB_AD_UNIT_IDS PLAY_PACKAGE_NAME RTDN_AUDIENCE RTDN_PUSH_SERVICE_ACCOUNT; do
            val="V_$v"; if [ -n "${!val}" ]; then echo "SET      $v = ${!val}"; else echo "MISSING  $v"; fi
          done
