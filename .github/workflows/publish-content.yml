# Publish a content release (INF-030, DEC-0031): build a content patch, sign its manifest, upload the immutable objects,
# verify them, then move the channel pointer. Manual and recorded: who, why, which commit, which generation.
#
# Releases are cumulative: the patch holds every change since the app release's base pack (never a chain of deltas), so
# a device always mounts exactly one pack over the app and a rollback is simply a new generation built from an older
# commit. Objects (bucket unaware-of-my-demise-content, DEC-0030):
#   packs/<sha256>.pck, manifests/<channel>/<generation>.json(.sig), history/<channel>/<generation>.json   never overwritten
#   channels/<channel>/current.json(.sig)                                                                  the pointer
# Needs the secrets CONTENT_SIGNING_KEY (owner decision D-09) and CLOUDFLARE_API_TOKEN; skipped with a warning without
# the signing key or a committed public key.
name: Publish content

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to publish to"
        type: choice
        options: [staging, production]
        default: staging
      base_commit:
        description: "Full SHA of the commit the installed app (AAB) was built from: its base pack"
        required: true
      min_version_code:
        description: "Lowest app versionCode this release is for"
        required: true
      max_version_code:
        description: "Highest app versionCode this release is for"
        required: true
      reason:
        description: "Why (recorded with the release)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    env:
      CHANNEL: ${{ inputs.channel }}
      BASE_COMMIT: ${{ inputs.base_commit }}
      MIN_CODE: ${{ inputs.min_version_code }}
      MAX_CODE: ${{ inputs.max_version_code }}
      REASON: ${{ inputs.reason }}
      CONTENT_SIGNING_KEY: ${{ secrets.CONTENT_SIGNING_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: unaware-of-my-demise-content
      KEY_ID: uomd-content-1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check configuration and inputs
        id: config
        run: |
          missing=""
          [ -n "${CONTENT_SIGNING_KEY}" ] || missing="${missing} secret:CONTENT_SIGNING_KEY"
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || missing="${missing} secret:CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || missing="${missing} variable:CLOUDFLARE_ACCOUNT_ID"
          [ -f "game/data/keys/${KEY_ID}.pem" ] || missing="${missing} public-key:game/data/keys/${KEY_ID}.pem"
          if [ -n "${missing}" ]; then
            echo "::warning::Publishing skipped; missing:${missing} (owner decision D-09)"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf '%s' "${BASE_COMMIT}" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::base_commit must be a full commit SHA"; exit 1; }
          git merge-base --is-ancestor "${BASE_COMMIT}" HEAD || { echo "::error::the base commit is not an ancestor of what is published"; exit 1; }
          [[ "${MIN_CODE}" =~ ^[1-9][0-9]*$ && "${MAX_CODE}" =~ ^[1-9][0-9]*$ && "${MIN_CODE}" -le "${MAX_CODE}" ]] \
            || { echo "::error::versionCode range must be positive integers, min <= max"; exit 1; }
          echo "ready=true" >> "${GITHUB_OUTPUT}"
      - name: Install the pinned Godot (checksum verified)
        if: steps.config.outputs.ready == 'true'
        run: |
          version="$(tr -d '[:space:]' < game/GODOT_VERSION)"
          base="https://github.com/godotengine/godot/releases/download/${version}"
          archive="Godot_v${version}_linux.x86_64.zip"
          mkdir -p "${RUNNER_TEMP}/godot" && cd "${RUNNER_TEMP}/godot"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          grep " ${archive}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${archive}"
          echo "GODOT=${RUNNER_TEMP}/godot/Godot_v${version}_linux.x86_64" >> "${GITHUB_ENV}"
      - name: Base pack of the app release
        if: steps.config.outputs.ready == 'true'
        run: |
          # --export-pack is byte-reproducible (DEC-0028): the base commit rebuilds the pack the app was built with.
          git worktree add "${RUNNER_TEMP}/base" "${BASE_COMMIT}"
          "${GODOT}" --headless --path "${RUNNER_TEMP}/base/game" --import >/dev/null 2>&1 || true
          "${GODOT}" --headless --path "${RUNNER_TEMP}/base/game" --export-pack Android "${RUNNER_TEMP}/base.pck" >/dev/null 2>&1
          echo "base pack $(sha256sum "${RUNNER_TEMP}/base.pck" | cut -d' ' -f1) from ${BASE_COMMIT}"
      - name: Build the content patch (data and imported assets only)
        if: steps.config.outputs.ready == 'true'
        run: |
          "${GODOT}" --headless --path game --import >/dev/null 2>&1 || true
          python3 tools/content_manifest.py --check
          python3 tools/validate_part1_content.py
          game/tools/build_content_patch.sh "${RUNNER_TEMP}/base.pck" "${RUNNER_TEMP}/patch.pck"
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Next generation, manifest and signature
        if: steps.config.outputs.ready == 'true'
        working-directory: server
        run: |
          npm ci
          r2() { npx wrangler r2 object "$@" --remote; }
          current=0
          if r2 get "${BUCKET}/channels/${CHANNEL}/current.json" --file "${RUNNER_TEMP}/current.json" >/dev/null 2>&1; then
            current="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["generation"]))' "${RUNNER_TEMP}/current.json")"
          fi
          generation=$((current + 1))
          sha="$(sha256sum "${RUNNER_TEMP}/patch.pck" | cut -d' ' -f1)"
          cp "${RUNNER_TEMP}/patch.pck" "${RUNNER_TEMP}/${sha}.pck"
          release="c$(date -u +%Y%m%d)-${CHANNEL}-g${generation}"
          python3 ../tools/content_release.py manifest --channel "${CHANNEL}" --release "${release}" --generation "${generation}" \
            --min-version-code "${MIN_CODE}" --max-version-code "${MAX_CODE}" --base "${RUNNER_TEMP}/base.pck" \
            --key-id "${KEY_ID}" "${RUNNER_TEMP}/${sha}.pck" > "${RUNNER_TEMP}/manifest.json"
          ../tools/sign_content_manifest.sh "${RUNNER_TEMP}/manifest.json"
          echo "GENERATION=${generation}" >> "${GITHUB_ENV}"
          echo "PACK_SHA=${sha}" >> "${GITHUB_ENV}"
          echo "RELEASE=${release}" >> "${GITHUB_ENV}"
      - name: Upload immutable objects, verify, then move the pointer
        if: steps.config.outputs.ready == 'true'
        working-directory: server
        run: |
          r2() { npx wrangler r2 object "$@" --remote; }
          exists() { r2 get "${BUCKET}/$1" --file "${RUNNER_TEMP}/probe" >/dev/null 2>&1; }
          check() {  # $1 key, $2 local file: the stored object equals the local bytes
            r2 get "${BUCKET}/$1" --file "${RUNNER_TEMP}/readback" >/dev/null
            cmp -s "${RUNNER_TEMP}/readback" "$2" || { echo "::error::$1 does not read back as uploaded"; exit 1; }
          }
          pack="packs/${PACK_SHA}.pck"
          if exists "${pack}"; then
            check "${pack}" "${RUNNER_TEMP}/patch.pck"   # content-addressed: same name, same bytes
          else
            r2 put "${BUCKET}/${pack}" --file "${RUNNER_TEMP}/patch.pck" --content-type application/octet-stream
            check "${pack}" "${RUNNER_TEMP}/patch.pck"
          fi
          for suffix in json json.sig; do
            key="manifests/${CHANNEL}/${GENERATION}.${suffix}"
            if exists "${key}"; then echo "::error::${key} already exists: generations are never overwritten"; exit 1; fi
            r2 put "${BUCKET}/${key}" --file "${RUNNER_TEMP}/manifest.${suffix}"
            check "${key}" "${RUNNER_TEMP}/manifest.${suffix}"
          done
          python3 - "${RUNNER_TEMP}/history.json" <<'PY'
          import json, os, sys
          json.dump({"channel": os.environ["CHANNEL"], "generation": int(os.environ["GENERATION"]), "release": os.environ["RELEASE"],
                     "pack_sha256": os.environ["PACK_SHA"], "commit": os.environ["GITHUB_SHA"], "base_commit": os.environ["BASE_COMMIT"],
                     "actor": os.environ["GITHUB_ACTOR"], "reason": os.environ["REASON"],
                     "run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'},
                    open(sys.argv[1], "w"), indent=2)
          PY
          r2 put "${BUCKET}/history/${CHANNEL}/${GENERATION}.json" --file "${RUNNER_TEMP}/history.json" --content-type application/json
          # The pointer last: until here, players see the previous release.
          r2 put "${BUCKET}/channels/${CHANNEL}/current.json.sig" --file "${RUNNER_TEMP}/manifest.json.sig"
          r2 put "${BUCKET}/channels/${CHANNEL}/current.json" --file "${RUNNER_TEMP}/manifest.json" --content-type application/json
          check "channels/${CHANNEL}/current.json" "${RUNNER_TEMP}/manifest.json"
          check "channels/${CHANNEL}/current.json.sig" "${RUNNER_TEMP}/manifest.json.sig"
          {
            echo "## Content release ${RELEASE}"
            echo "- channel: ${CHANNEL}, generation ${GENERATION}"
            echo "- pack: \`${PACK_SHA}\`"
            echo "- commit: \`${GITHUB_SHA}\` over base \`${BASE_COMMIT}\`"
            echo "- app versionCodes: ${MIN_CODE}-${MAX_CODE}"
            echo "- by: ${GITHUB_ACTOR}; reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"
