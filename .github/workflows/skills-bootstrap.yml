name: Bootstrap Claude project skills
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skill-sources/**"
      - "tools/bootstrap_skills.py"
      - ".github/workflows/skills-bootstrap.yml"

concurrency:
  group: uomd-skills-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  install-reviewed-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned sources and install curated skills
        if: ${{ hashFiles('skill-sources/UOMD_Claude_Phaser_Toolkit_2026-10-10.zip') != '' && hashFiles('skill-sources/awesome-gamedev-agent-skills-1.1.0.zip') != '' }}
        run: python3 tools/bootstrap_skills.py
      - name: Structural verification
        if: ${{ hashFiles('skill-sources/UOMD_Claude_Phaser_Toolkit_2026-10-10.zip') != '' && hashFiles('skill-sources/awesome-gamedev-agent-skills-1.1.0.zip') != '' }}
        run: |
          python3 tools/bootstrap_skills.py --verify
          python3 tools/skills_doctor.py
      - name: Commit pinned skill files (not third-party hooks)
        if: ${{ hashFiles('skill-sources/UOMD_Claude_Phaser_Toolkit_2026-10-10.zip') != '' && hashFiles('skill-sources/awesome-gamedev-agent-skills-1.1.0.zip') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills .claude/third-party-licenses .claude/skills-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: install vetted project skills from locked sources"
            # Do not overwrite newer README/source commits made while CI was running.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
