# Signed release AAB (INF-039/040/041, DEC-0035): built from a commit of main with the pinned toolchain, signed with the
# upload key, validated by bundletool and checked as the universal APK a device installs. The AAB, the base pack the
# content patches of this release apply to, and a provenance file (hashes, commit, upload certificate) are kept as
# artifacts; uploading to a Play test track is a separate, manual step (owner decision D-13).
#
# The versionCode/versionName are the committed ones (project.godot uomd/release/version_code, export_presets.cfg
# version/name): raising them is a reviewed commit. A versionCode already built by an earlier run is refused.
# Needs the secrets ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEYSTORE_PASSWORD
# (keystore and key share the password); skipped with a warning without them.
name: Release Android

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  # bundletool 1.18.2 (google/bundletool releases). The release publishes no checksum, so the hash is pinned here.
  BUNDLETOOL_URL: https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
  BUNDLETOOL_SHA256: 378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration and the version
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::releases are built from main only"; exit 1; fi
          missing=""
          [ -n "${ANDROID_UPLOAD_KEYSTORE_BASE64}" ] || missing="${missing} secret:ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "${ANDROID_UPLOAD_KEY_ALIAS}" ] || missing="${missing} secret:ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" ] || missing="${missing} secret:ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::warning::Release skipped; missing:${missing} (owner decision D-13)"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          code="$(sed -n 's/^release\/version_code=//p' game/project.godot)"
          name="$(sed -n 's/^version\/name="\(.*\)"/\1/p' game/export_presets.cfg | head -n1)"
          [ "$(sed -n 's/^version\/code=//p' game/export_presets.cfg | sort -u)" = "${code}" ] || { echo "::error::export_presets.cfg version/code differs from project.godot uomd/release/version_code"; exit 1; }
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=uomd-release-${code}&per_page=1" --jq '.total_count')"
          [ "${existing:-0}" -eq 0 ] || { echo "::error::versionCode ${code} was already built (artifact uomd-release-${code}); raise uomd/release/version_code"; exit 1; }
          echo "VERSION_CODE=${code}" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${name}" >> "${GITHUB_ENV}"
          echo "ready=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-java@v4
        if: steps.config.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.config.outputs.ready == 'true'
        with:
          gradle-version: "8.11.1"
      - name: Android SDK packages and bundletool
        if: steps.config.outputs.ready == 'true'
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" >/dev/null
          curl -fsSL -o "${RUNNER_TEMP}/bundletool.jar" "${BUNDLETOOL_URL}"
          echo "${BUNDLETOOL_SHA256}  ${RUNNER_TEMP}/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL=${RUNNER_TEMP}/bundletool.jar" >> "${GITHUB_ENV}"
      - name: Build the UomdNative AARs
        if: steps.config.outputs.ready == 'true'
        env:
          # The owner's AdMob app id (D-18); unset, the build carries Google's sample id and serves only test ads.
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          [ -n "${ADMOB_APP_ID}" ] || echo "::warning::variable ADMOB_APP_ID is not set: this release carries Google's sample AdMob app id (test ads only)"
          game/tools/build_uomd_native.sh
      - name: Install the pinned Godot and its Android export templates (checksums verified)
        if: steps.config.outputs.ready == 'true'
        run: |
          version="$(tr -d '[:space:]' < game/GODOT_VERSION)"
          base="https://github.com/godotengine/godot/releases/download/${version}"
          mkdir -p "${RUNNER_TEMP}/godot" && cd "${RUNNER_TEMP}/godot"
          editor="Godot_v${version}_linux.x86_64.zip"
          templates="Godot_v${version}_export_templates.tpz"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          curl -fsSLO "${base}/${editor}"
          curl -fsSLO "${base}/${templates}"
          grep -E " (${editor}|${templates})\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${editor}"
          target="${HOME}/.local/share/godot/export_templates/${version/-/.}"
          mkdir -p "${target}"
          unzip -q -o -j "${templates}" 'templates/android*' 'templates/version.txt' -d "${target}"
          rm "${templates}"
          echo "GODOT=${RUNNER_TEMP}/godot/Godot_v${version}_linux.x86_64" >> "${GITHUB_ENV}"
      - name: Upload keystore
        if: steps.config.outputs.ready == 'true'
        run: |
          umask 077
          value="$(printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | tr -d '[:space:]')"
          printf '%s' "${value}" | base64 -d > "${RUNNER_TEMP}/upload.jks" 2>/dev/null \
            || { echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 does not decode (${#value} characters)"; exit 1; }
          keytool -list -keystore "${RUNNER_TEMP}/upload.jks" -storepass "${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" -alias "${ANDROID_UPLOAD_KEY_ALIAS}" >/dev/null \
            || { echo "::error::the upload keystore has no alias ANDROID_UPLOAD_KEY_ALIAS with that password"; exit 1; }
          echo "UPLOAD_KEYSTORE=${RUNNER_TEMP}/upload.jks" >> "${GITHUB_ENV}"
      - name: Export, sign and verify the AAB
        if: steps.config.outputs.ready == 'true'
        env:
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: game/tools/build_android_release.sh "${RUNNER_TEMP}/release"
      - name: Record
        if: steps.config.outputs.ready == 'true'
        run: |
          {
            echo "## Android release ${VERSION_CODE} (${VERSION_NAME})"
            echo '```json'
            cat "${RUNNER_TEMP}/release/provenance-${VERSION_CODE}.json"
            echo '```'
            echo "Next: upload the AAB to a Play internal/closed test track (D-13), then publish base-${VERSION_CODE}.pck's"
            echo "commit as the base of content releases for this versionCode."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.ready == 'true'
        with:
          name: uomd-release-${{ env.VERSION_CODE }}
          path: |
            ${{ runner.temp }}/release/uomd-${{ env.VERSION_CODE }}.aab
            ${{ runner.temp }}/release/base-${{ env.VERSION_CODE }}.pck
            ${{ runner.temp }}/release/provenance-${{ env.VERSION_CODE }}.json
          retention-days: 90
      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"
