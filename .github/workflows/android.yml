name: Android build
# Builds the Capacitor Android shell: a signed release AAB (for Google Play) and a debug APK that is smoke-tested on an emulator.
# The Play UPLOAD keystore is generated here ONCE (random password, never printed) and kept in the private R2 bucket
# uomd-android-signing; later runs reuse it. If the owner prefers GitHub secrets, set ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD
# (+ ANDROID_KEY_ALIAS) and those win. Play App Signing (default for new apps) keeps the real app-signing key at Google.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: Game API the app talks to
        default: https://uomd-game-staging.muratcaneksiii.workers.dev
      channel:
        description: Content channel
        type: choice
        options: [staging, dev]
        default: staging
  push:
    branches: [main]
    paths: ['apps/android/**', 'apps/game/**', 'packages/**', '.github/workflows/android.yml']

concurrency:
  group: android-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0c942d198668a8b1a8e8ee699651b817' }}
      SECRET_KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      SECRET_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SECRET_KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      UOMD_API_BASE: ${{ inputs.api_base || 'https://uomd-game-staging.muratcaneksiii.workers.dev' }}
      UOMD_CHANNEL: ${{ inputs.channel || 'staging' }}
      UOMD_VERSION_CODE: ${{ github.run_number }}
      UOMD_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Upload keystore (reuse, or generate once)
        id: ks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          KS="$RUNNER_TEMP/ks/upload.jks"
          ALIAS=upload
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ]; then
            echo "$SECRET_KS_B64" | base64 -d > "$KS"
            PASS="$SECRET_KS_PASS"; ALIAS="${SECRET_KS_ALIAS:-upload}"
            echo "source=github-secrets" >> "$GITHUB_OUTPUT"
          elif npx wrangler r2 object get uomd-android-signing/upload.jks --file "$KS" --remote >/dev/null 2>&1 \
            && npx wrangler r2 object get uomd-android-signing/upload.pass --file "$RUNNER_TEMP/ks/upload.pass" --remote >/dev/null 2>&1; then
            PASS="$(cat "$RUNNER_TEMP/ks/upload.pass")"
            echo "source=r2" >> "$GITHUB_OUTPUT"
          else
            [ -n "${CLOUDFLARE_API_TOKEN}" ] || { echo "::error::no keystore secret and no CLOUDFLARE_API_TOKEN to keep a generated one"; exit 1; }
            PASS="$(openssl rand -base64 33 | tr -d '=+/\n' | cut -c1-32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Unaware of My Demise upload key, O=UOMD" >/dev/null 2>&1
            printf '%s' "$PASS" > "$RUNNER_TEMP/ks/upload.pass"
            npx wrangler r2 object put uomd-android-signing/upload.jks --file "$KS" --remote >/dev/null
            npx wrangler r2 object put uomd-android-signing/upload.pass --file "$RUNNER_TEMP/ks/upload.pass" --remote >/dev/null
            echo "source=generated-now" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$PASS"
          echo "UOMD_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "UOMD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "UOMD_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          # public fingerprints only: register these with the Android OAuth client (Google sign-in) and Play
          keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" 2>/dev/null | grep -E "SHA1:|SHA256:" | sed 's/^ *//' > "$RUNNER_TEMP/ks/fingerprints.txt"
          {
            echo "### Upload key fingerprints (public)"
            echo '```'
            cat "$RUNNER_TEMP/ks/fingerprints.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build web client for the app
        run: npm run build:web -w @uomd/android
      - name: Sync Capacitor
        working-directory: apps/android
        run: npx cap sync android
      - name: Build signed release AAB and debug APK
        working-directory: apps/android/android
        env:
          UOMD_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease assembleDebug
      - name: Verify the AAB signature
        run: |
          AAB=apps/android/android/app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          jarsigner -verify "$AAB" | head -2
          echo "### AAB" >> "$GITHUB_STEP_SUMMARY"
          echo "versionCode ${UOMD_VERSION_CODE}, $(du -h "$AAB" | cut -f1), API ${UOMD_API_BASE}, keystore: ${{ steps.ks.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: uomd-android
          path: |
            apps/android/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  emulator-smoke:
    name: boot the debug app on an Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uomd-android
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/android_smoke.sh out/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: .cache/android-smoke
          if-no-files-found: ignore
          retention-days: 14
