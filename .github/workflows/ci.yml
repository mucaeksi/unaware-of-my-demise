# Validation for every push and pull request: database schema, Worker API, Godot client, admin panel, Android debug APK.
# Production deploys run in deploy.yml (DEC-0003).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # INF-021: the content packs (game/data/content, the single authoring source) agree with their manifest, which both
  # client and server hash into the rules hash, and pass the cross-pack audit (references resolve, every battle rule key
  # is read by both the GDScript and the TypeScript engine or recorded as descriptive).
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/content_manifest.py --check
      - run: python3 tools/validate_part1_content.py
      - name: Tool tests (PCK inventory and content-patch policy)
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The production major (database/POSTGRES_MAJOR, Neon project pg_version); the first step checks they agree.
        image: postgres:18
        # Throwaway CI database, not a secret.
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: The test server runs the production PostgreSQL major
        run: |
          expected="$(tr -d '[:space:]' < database/POSTGRES_MAJOR)"
          actual="$(psql postgresql://postgres:postgres@localhost:5432/postgres -At -c "SELECT current_setting('server_version_num')::int / 10000")"
          echo "server major ${actual}, production major ${expected}"
          [ "${actual}" = "${expected}" ] || { echo "::error::CI runs PostgreSQL ${actual}, production runs ${expected} (database/POSTGRES_MAJOR)"; exit 1; }
      - name: Migrations and constraint tests
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: database/test.sh

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The production major (database/POSTGRES_MAJOR, Neon project pg_version); the first step checks they agree.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Tests (disposable PostgreSQL)
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm test
      - name: Bundle (wrangler dry-run)
        run: npm run build

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Godot (checksum verified)
        run: |
          version="$(tr -d '[:space:]' < game/GODOT_VERSION)"
          base="https://github.com/godotengine/godot/releases/download/${version}"
          archive="Godot_v${version}_linux.x86_64.zip"
          mkdir -p "${RUNNER_TEMP}/godot" && cd "${RUNNER_TEMP}/godot"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          grep " ${archive}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${archive}"
          echo "GODOT=${RUNNER_TEMP}/godot/Godot_v${version}_linux.x86_64" >> "${GITHUB_ENV}"
      - name: Import
        run: |
          "${GODOT}" --headless --path game --import || "${GODOT}" --headless --path game --import
      - name: GUT (unit, parity, ui, contract)
        run: |
          set -o pipefail
          "${GODOT}" --headless --path game -s addons/gut/gut_cmdln.gd -gexit -gjunit_xml_file="${RUNNER_TEMP}/gut-junit.xml" 2>&1 | tee "${RUNNER_TEMP}/gut.log"
      # INF-007: GUT's exit status misses a test script that fails to load; the report check does not.
      - name: Every test script ran, none failed, no script errors
        if: ${{ !cancelled() }}
        run: game/tools/check_gut_report.sh "${RUNNER_TEMP}/gut-junit.xml" "${RUNNER_TEMP}/gut.log"
      # INF-027 end to end with the pinned engine: against this commit's base pack, a data change makes a content patch
      # that passes the policy, and a script change is refused (it needs an app release).
      - name: Content patch gate
        run: |
          "${GODOT}" --headless --path game --export-pack Android "${RUNNER_TEMP}/base.pck" >/dev/null 2>&1
          printf '\n' >> game/data/content/lore_text_part1.json
          game/tools/build_content_patch.sh "${RUNNER_TEMP}/base.pck" "${RUNNER_TEMP}/data.pck"
          printf '\nfunc _uomd_patch_probe() -> void:\n\tpass\n' >> game/scripts/core/content/localized_text.gd
          if game/tools/build_content_patch.sh "${RUNNER_TEMP}/base.pck" "${RUNNER_TEMP}/code.pck"; then
            echo "::error::a script change passed the content-patch gate"
            exit 1
          fi
          git checkout -- game/data/content/lore_text_part1.json game/scripts/core/content/localized_text.gd
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gut-report
          path: |
            ${{ runner.temp }}/gut-junit.xml
            ${{ runner.temp }}/gut.log
          retention-days: 14

  # INF-007: the admin panel installs from its lockfile, type-checks and builds. It is still the starter (docs/CURRENT_STATE.md
  # §3, NEEDS_REWRITE in INF-033); this job keeps the rewrite starting from a reproducible, building base.
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # INF-042: the real client against the real Worker over HTTP with PostgreSQL (server/e2e/run.sh): a new player plays
  # the opening chapter with server-verified victories, then a fresh client with the same session sees the same player.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Install the pinned Godot (checksum verified)
        run: |
          version="$(tr -d '[:space:]' < game/GODOT_VERSION)"
          base="https://github.com/godotengine/godot/releases/download/${version}"
          archive="Godot_v${version}_linux.x86_64.zip"
          mkdir -p "${RUNNER_TEMP}/godot" && cd "${RUNNER_TEMP}/godot"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          grep " ${archive}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${archive}"
          echo "GODOT=${RUNNER_TEMP}/godot/Godot_v${version}_linux.x86_64" >> "${GITHUB_ENV}"
      - name: End to end
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: server/e2e/run.sh "${RUNNER_TEMP}/e2e-junit.xml"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            ${{ runner.temp }}/e2e-junit.xml
            ${{ runner.temp }}/e2e-junit.log
          retention-days: 14

  # INF-007/INF-017: the UomdNative Android plugin (Google sign-in through Credential Manager) and a debug APK built from it with
  # the pinned toolchain, verified by game/tools/verify_apk.sh and kept as an artifact for device tests. The APK is signed with
  # the repository's debug keystore (secret ANDROID_DEBUG_KEYSTORE_BASE64) so its certificate SHA-1 stays registered with the
  # Android OAuth client; without the secret a throwaway key is used and sign-in on a device fails with a developer error.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - name: Build the UomdNative AARs
        run: game/tools/build_uomd_native.sh
      - name: Install the pinned Godot and its Android export templates (checksums verified)
        run: |
          version="$(tr -d '[:space:]' < game/GODOT_VERSION)"
          base="https://github.com/godotengine/godot/releases/download/${version}"
          mkdir -p "${RUNNER_TEMP}/godot" && cd "${RUNNER_TEMP}/godot"
          editor="Godot_v${version}_linux.x86_64.zip"
          templates="Godot_v${version}_export_templates.tpz"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          curl -fsSLO "${base}/${editor}"
          curl -fsSLO "${base}/${templates}"
          grep -E " (${editor}|${templates})\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${editor}"
          target="${HOME}/.local/share/godot/export_templates/${version/-/.}"
          mkdir -p "${target}"
          unzip -q -o -j "${templates}" 'templates/android*' 'templates/version.txt' -d "${target}"
          rm "${templates}"
          echo "GODOT=${RUNNER_TEMP}/godot/Godot_v${version}_linux.x86_64" >> "${GITHUB_ENV}"
      - name: Debug keystore
        run: |
          config_dir="${HOME}/.config/godot"
          mkdir -p "${config_dir}"
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            # Whitespace and line breaks from copying are dropped; anything else must be base64. The value is never printed.
            value="$(printf '%s' "${ANDROID_DEBUG_KEYSTORE_BASE64}" | tr -d '[:space:]')"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
              echo "::error::secret ANDROID_DEBUG_KEYSTORE_BASE64 (${#value} characters) contains characters outside base64, e.g. the shell prompt pasted after the value; paste only the output of base64 -w0"
              exit 1
            fi
            if ! printf '%s' "${value}" | base64 -d > "${config_dir}/debug.keystore" 2>/dev/null; then
              echo "::error::secret ANDROID_DEBUG_KEYSTORE_BASE64 does not decode: ${#value} characters (remainder $(( ${#value} % 4 )) after dividing by 4; a complete value has remainder 0), so part of it is missing; copy the whole base64 -w0 output again"
              exit 1
            fi
            # The export signs with alias androiddebugkey and password android (game/tools/build_android_debug.sh).
            keytool -list -keystore "${config_dir}/debug.keystore" -storepass android -alias androiddebugkey >/dev/null \
              || { echo "::error::the keystore in ANDROID_DEBUG_KEYSTORE_BASE64 has no alias androiddebugkey with password android"; exit 1; }
            keytool -list -v -keystore "${config_dir}/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:"
          else
            echo "::warning::secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway key and Google sign-in will not work on a device"
          fi
      - name: Export and verify the debug APK
        run: game/tools/build_android_debug.sh "${RUNNER_TEMP}/uomd-debug.apk"
      - name: Signing certificate (register its SHA-1 with the Android OAuth client)
        run: |
          "${ANDROID_HOME}/build-tools/36.1.0/apksigner" verify --print-certs "${RUNNER_TEMP}/uomd-debug.apk" | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: uomd-debug-apk
          path: ${{ runner.temp }}/uomd-debug.apk
          retention-days: 14
