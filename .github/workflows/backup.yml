# Nightly off-site backup (INF-011, owner decision D-05, docs/runbooks/BACKUP_RESTORE.md): production's data outside
# Neon, which keeps only 6 hours of history on its free plan.
#
# Production is dumped read-only (pg_dump, one consistent snapshot over the direct Neon host, the client of the production
# major) and encrypted on the runner with `age` to the owner's public key (variable BACKUP_AGE_RECIPIENT). Only the
# encrypted file leaves the runner: it goes to the private R2 bucket uomd-db-backups, whose lifecycle rule deletes
# objects after 30 days. The private key that opens the backups exists only offline with the owner; GitHub, Cloudflare
# and this workflow cannot read a backup. The plaintext dump never becomes an artifact and is shredded at the end.
#
# Needs: secret DATABASE_URL, secrets R2_BACKUP_ACCESS_KEY_ID / R2_BACKUP_SECRET_ACCESS_KEY (an R2 token limited to the
# bucket, Object Read & Write), variables BACKUP_AGE_RECIPIENT and CLOUDFLARE_ACCOUNT_ID. Skipped with a warning while
# any is missing.
name: Backup

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:23 UTC (before the 03:17 retention cron).
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: uomd-db-backups
      # R2 speaks the S3 API; recent AWS CLIs add checksum headers by default, sent here only where S3 requires them.
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=""
          [ -n "${DATABASE_URL}" ] || missing="${missing} secret:DATABASE_URL"
          [ -n "${AWS_ACCESS_KEY_ID}" ] || missing="${missing} secret:R2_BACKUP_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY}" ] || missing="${missing} secret:R2_BACKUP_SECRET_ACCESS_KEY"
          [ -n "${AGE_RECIPIENT}" ] || missing="${missing} variable:BACKUP_AGE_RECIPIENT"
          [ -n "${ACCOUNT_ID}" ] || missing="${missing} variable:CLOUDFLARE_ACCOUNT_ID"
          if [ -n "${missing}" ]; then
            echo "::warning::Backup skipped, not configured:${missing}"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # An age X25519 recipient; anything else (a private key pasted by mistake, a typo) is refused, never used.
          if ! printf '%s' "${AGE_RECIPIENT}" | grep -Eq '^age1[02-9ac-hj-np-z]{58}$'; then
            echo "::error::variable BACKUP_AGE_RECIPIENT is not an age public key (age1… from age-keygen)"
            exit 1
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - name: Dump production (read-only)
        if: steps.config.outputs.ready == 'true'
        run: |
          # pg_dump needs a session: Neon's pooled host ("-pooler") runs PgBouncer in transaction mode, so use the direct one.
          direct="${DATABASE_URL/-pooler./.}"
          echo "::add-mask::${direct}"
          major="$(tr -d '[:space:]' < database/POSTGRES_MAJOR)"
          # As the runner's user, so the dump stays its file (the plaintext is shredded after encryption).
          docker run --rm --network host --user "$(id -u):$(id -g)" -e DUMP_URL="${direct}" -v "${RUNNER_TEMP}:/work" "postgres:${major}" \
            sh -c 'pg_dump --dbname="${DUMP_URL}" --format=custom --no-owner --no-privileges --file=/work/production.dump'
          # A dump that pg_restore cannot list is not a backup.
          docker run --rm --user "$(id -u):$(id -g)" -v "${RUNNER_TEMP}:/work" "postgres:${major}" pg_restore --list /work/production.dump > /dev/null
          [ -O "${RUNNER_TEMP}/production.dump" ] || { echo "::error::the dump is not the runner's file and could not be shredded"; exit 1; }
      - name: Encrypt for the owner's key
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq age > /dev/null
          age --recipient "${AGE_RECIPIENT}" --output "${RUNNER_TEMP}/production.dump.age" "${RUNNER_TEMP}/production.dump"
          head -c 21 "${RUNNER_TEMP}/production.dump.age" | grep -q '^age-encryption.org/v1' \
            || { echo "::error::the encrypted file has no age header"; exit 1; }
          shred -u "${RUNNER_TEMP}/production.dump"
      - name: Upload to R2
        if: steps.config.outputs.ready == 'true'
        run: |
          endpoint="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="production/$(date -u +%Y/%m/%d)/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}.dump.age"
          file="${RUNNER_TEMP}/production.dump.age"
          aws s3 cp "${file}" "s3://${BUCKET}/${key}" --endpoint-url "${endpoint}" --only-show-errors
          stored="$(aws s3api head-object --bucket "${BUCKET}" --key "${key}" --endpoint-url "${endpoint}" --query ContentLength --output text)"
          local_size="$(stat -c %s "${file}")"
          [ "${stored}" = "${local_size}" ] || { echo "::error::R2 holds ${stored} bytes, the backup has ${local_size}"; exit 1; }
          {
            echo "## Backup"
            echo "| | |"
            echo "|---|---|"
            echo "| object | \`${BUCKET}/${key}\` |"
            echo "| size (encrypted) | ${local_size} bytes |"
            echo "| sha256 (encrypted) | \`$(sha256sum "${file}" | cut -d' ' -f1)\` |"
            echo "| opens with | the owner's offline age key only (docs/runbooks/BACKUP_RESTORE.md) |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove local copies
        if: always()
        run: rm -f "${RUNNER_TEMP}/production.dump" "${RUNNER_TEMP}/production.dump.age"
