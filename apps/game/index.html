<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0610" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Unaware of My Demise</title>
    <style>
      :root { color-scheme: dark; --void: #0a0610; --silver: #c9b6e4; }
      html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 40%, #1b1024 0%, var(--void) 70%); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: var(--silver); font: 600 18px/1.4 "Cinzel", Georgia, serif; letter-spacing: 0.3em; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s; }
      #boot.done { opacity: 0; }
      #rotate { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: var(--void); color: var(--silver); font: 600 20px/1.6 "Cinzel", Georgia, serif; letter-spacing: 0.12em; z-index: 10; padding: 32px; }
      @media (orientation: portrait) { #rotate { display: grid; } }
      #fatal { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: var(--void); color: #e8b4c4; font: 500 18px/1.6 Georgia, serif; padding: 32px; z-index: 20; }
      @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Unaware of My Demise game canvas"></div>
    <div id="boot" role="status">Unaware of My Demise</div>
    <div id="rotate" role="alert">Turn your device sideways.<br />The bells are best heard in landscape.</div>
    <div id="fatal" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
