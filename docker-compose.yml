services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gacha
      POSTGRES_USER: gacha
      POSTGRES_PASSWORD: gacha
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build: ./server
    env_file: [.env]
    depends_on: [db]
    ports: ["8080:8080"]
volumes:
  pgdata:
